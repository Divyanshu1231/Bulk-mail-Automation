services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: bulk-mail-automation
    runtime: python
    rootDir: backend
    plan: free            # SQLite data resets on redeploy/restart. Use "starter" + disk below to persist.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Recruitment Team
      - key: FRONTEND_ORIGIN
        value: https://bulk-mail-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://bulk-mail-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: MAX_SEND_PER_REQUEST
        value: "20"
      - key: DATABASE_PATH
        value: ./email_automation.db
    # For persistent SQLite: change plan to starter, uncomment, and set DATABASE_PATH=/var/data/email_automation.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------- Frontend (React + Vite, Static Site) ----------
  - type: web
    name: bulk-mail-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://bulk-mail-automation.onrender.com
